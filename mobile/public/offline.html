<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176B57" />
    <title>Aught2 Pickleball — Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #F4F8F5;
        color: #102F2B;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid #DDE8E2;
        border-radius: 20px;
        padding: 36px 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(16, 47, 43, 0.06);
      }
      .icon-circle {
        width: 72px;
        height: 72px;
        border-radius: 36px;
        background: #E5F6EC;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px auto;
        color: #176B57;
      }
      .icon-circle svg {
        width: 36px;
        height: 36px;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        color: #102F2B;
        margin-bottom: 10px;
        letter-spacing: -0.3px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #526360;
        margin-bottom: 24px;
      }
      .retry-btn {
        background-color: #176B57;
        color: #FFFFFF;
        border: none;
        border-radius: 999px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
      }
      .retry-btn:hover {
        background-color: #104A3C;
      }
      .retry-btn:active {
        transform: scale(0.98);
      }
      .brand-footnote {
        margin-top: 24px;
        font-size: 12px;
        color: #8C9E9A;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-circle">
        <!-- Wifi Off / Offline SVG Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Connection Lost</h1>
      <p>
        Aught2 Pickleball requires an active internet connection to load live courts, match schedules, tournament brackets, and club memberships.
      </p>
      <button class="retry-btn" onclick="window.location.reload()">
        Retry Connection
      </button>
      <div class="brand-footnote">Aught2 Pickleball Club Management</div>
    </div>
    <script>
      // Auto-reload when network reconnects
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
