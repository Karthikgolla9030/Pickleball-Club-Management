<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Mobile viewport with viewport-fit=cover, preserving accessible user zoom -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Brand Colors -->
    <meta name="theme-color" content="#176B57" />
    <meta name="msapplication-TileColor" content="#176B57" />

    <!-- Apple iOS PWA Metadata & Touch Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aught2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- General Metadata -->
    <meta name="description" content="Aught2 Pickleball Club & Tournament Management Platform" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        background-color: #F4F8F5;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        min-height: 100%;
        width: 100%;
        flex: 1;
        overflow-x: hidden;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run Aught2 Pickleball.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function() {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version available.');
                  }
                };
              }
            };
          }).catch(function(err) {
            console.warn('[PWA] ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
